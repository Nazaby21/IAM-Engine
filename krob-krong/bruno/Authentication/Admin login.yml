info:
  name: Admin login
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/api/auth/login"
  body:
    type: json
    data: |-
      {"email":"{{admin_email}}","password":"{{admin_password}}","mfa_code":"{{mfa_code}}"}

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setVar("admin_access_token", res.body.data.access_token);
        }
    - type: tests
      code: |-
        test("responds 200", () => expect(res.status).to.equal(200));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Signs in a super admin with an authenticator code and stores admin_access_token for the School review requests,
  leaving access_token untouched. Set admin_email, the admin_password secret and mfa_code (the app's current code;
  each code works once). Errors: 403 MFA_REQUIRED without a code, 401 INVALID_MFA_CODE, 429 MFA_LOCKED.
