info:
  name: Grantable roles
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/roles/grantable?school_id={{school_id}}"
  params:
    - name: school_id
      value: "{{school_id}}"
      type: query
    - name: branch_id
      value: "{{branch_id}}"
      type: query
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 200", () => expect(res.status).to.equal(200));
        test("uses the ApiResponse envelope", () => {
          expect(res.body).to.have.property("data");
          expect(res.body.error).to.equal(null);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Roles the caller may grant in that school (and branch, if given).
  Without `school_id` it answers for platform roles.
