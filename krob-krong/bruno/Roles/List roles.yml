info:
  name: List roles
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/roles?page=0&size=20"
  params:
    - name: page
      value: "0"
      type: query
    - name: size
      value: "20"
      type: query
    - name: kind
      value: school
      type: query
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const role_code = bru.getEnvVar("role_code") || "student";
        const role = (res.body?.data?.content || []).find((r) => r.code === role_code);
        if (role) {
          bru.setVar("role_id", role.id);
        }
    - type: tests
      code: |-
        test("responds 200", () => expect(res.status).to.equal(200));
        test("uses the ApiResponse envelope", () => {
          expect(res.body).to.have.property("data");
          expect(res.body.error).to.equal(null);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Paged role catalog. Any signed-in user.

  `kind` filters by role kind: `anyone`, `authenticated`, `platform`, `school`, `support`.
  Stores the id of the role whose code is `{{role_code}}` in `role_id`.
