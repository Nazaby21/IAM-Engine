info:
  name: List members
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/schools/{{school_id}}/members?page=0&size=20"
  params:
    - name: page
      value: "0"
      type: query
    - name: size
      value: "20"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 200", () => expect(res.status).to.equal(200));
        test("uses the ApiResponse envelope", () => {
          expect(res.body).to.have.property("data");
          expect(res.body.error).to.equal(null);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Members of the school with their roles. Requires `member:read` in the school.
