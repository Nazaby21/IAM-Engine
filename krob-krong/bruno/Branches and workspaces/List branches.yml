---
info:
  name: List branches
  type: http
  seq: 1
http:
  method: GET
  url: "{{base_url}}/api/schools/{{school_id}}/branches"
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: test("responds 200", () => expect(res.status).to.equal(200));
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
docs: Only branches visible to the caller are returned. Does not change branch_id.
