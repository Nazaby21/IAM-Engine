---
info:
  name: Resolve workspace
  type: http
  seq: 3
http:
  method: GET
  url: "{{base_url}}/api/workspaces/{{workspace_slug}}"
runtime:
  scripts:
  - type: tests
    code: test("responds 200", () => expect(res.status).to.equal(200));
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
docs: Public. Only approved school + active branch resolve. Retired aliases resolve
  to canonical_slug. Draft/rejected/suspended schools return 404.
