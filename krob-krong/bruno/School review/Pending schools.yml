---
info:
  name: Pending schools
  type: http
  seq: 1
http:
  method: GET
  url: "{{base_url}}/api/admin/schools?status=pending_review&page=0&size=20"
  auth:
    type: bearer
    token: "{{admin_access_token}}"
runtime:
  scripts:
  - type: tests
    code: test("responds 200", () => expect(res.status).to.equal(200));
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
docs: Select school_id to review from content. Status can be any lifecycle status
  or omitted. Does not automatically select a school.
