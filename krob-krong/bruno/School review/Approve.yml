---
info:
  name: Approve
  type: http
  seq: 3
http:
  method: POST
  url: "{{base_url}}/api/admin/schools/{{school_id}}/review"
  auth:
    type: bearer
    token: "{{admin_access_token}}"
  body:
    type: json
    data: |-
      {
        "review_id": "{{review_id}}",
        "decision": "approved",
        "reason": null
      }
runtime:
  scripts:
  - type: tests
    code: test("responds 200", () => expect(res.status).to.equal(200));
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
docs: Reviewer cannot be the creator or have any school membership grant, including
  historical grants. Changes/rejection require a reason. This decision closes the
  selected review.
