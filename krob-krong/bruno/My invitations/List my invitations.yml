info:
  name: List my invitations
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/me/invitations"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const pending = res.body?.data || [];
        if (pending.length > 0) {
          bru.setVar("user_role_id", pending[0].id);
        }
    - type: tests
      code: |-
        test("responds 200", () => expect(res.status).to.equal(200));
        test("uses the ApiResponse envelope", () => {
          expect(res.body).to.have.property("data");
          expect(res.body.error).to.equal(null);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Pending invitations for the caller, newest first. Stores the first one in `user_role_id`.
