info:
  name: Start authenticator enrollment
  type: http
  seq: 1
http:
  method: POST
  url: "{{base_url}}/api/me/mfa/totp"
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      test("responds 201", () => expect(res.status).to.equal(201));
      test("returns the secret and otpauth URI", () => {
        expect(res.body.data.secret).to.be.a("string").and.not.empty;
        expect(res.body.data.otpauth_uri).to.match(/^otpauth:\/\/totp\//);
      });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
docs: Returns the authenticator secret once; it is not stored in a variable. Running this again replaces an
  enrollment that is not active yet. 409 MFA_ALREADY_ENABLED once MFA is on.
