info:
  name: Get permission
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/api/permissions/{{permission_code}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 200", () => expect(res.status).to.equal(200));
        test("uses the ApiResponse envelope", () => {
          expect(res.body).to.have.property("data");
          expect(res.body.error).to.equal(null);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: "One permission: code, description, and whether its use is logged as sensitive. Any signed-in user."
