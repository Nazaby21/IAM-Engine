info:
  name: List permissions
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/permissions?page=0&size=50"
  params:
    - name: page
      value: "0"
      type: query
    - name: size
      value: "50"
      type: query
    - name: search
      value: school
      type: query
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 200", () => expect(res.status).to.equal(200));
        test("uses the ApiResponse envelope", () => {
          expect(res.body).to.have.property("data");
          expect(res.body.error).to.equal(null);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Paged permission catalog. `search` matches the start of the code (e.g. `school`). Any signed-in user.
