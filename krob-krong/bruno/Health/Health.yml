info:
  name: Health
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/actuator/health"

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 200", () => expect(res.status).to.equal(200));
        test("is UP", () => expect(res.body.status).to.equal("UP"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Liveness and readiness of the app. Public.
