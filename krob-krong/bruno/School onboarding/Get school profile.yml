---
info:
  name: Get school profile
  type: http
  seq: 10
http:
  method: GET
  url: "{{base_url}}/api/schools/{{school_id}}"
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: test("responds 200", () => expect(res.status).to.equal(200));
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
docs: Draft access requires school permissions; approved profiles are public. Suspended
  school members cannot read full profiles.
