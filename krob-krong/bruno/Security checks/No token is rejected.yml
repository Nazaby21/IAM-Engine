info:
  name: No token is rejected
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/roles"

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 401", () => expect(res.status).to.equal(401));
        test("asks for a bearer token", () => expect(res.headers["www-authenticate"]).to.equal("Bearer"));
        test("error code", () => expect(res.body.error.code).to.equal("UNAUTHORIZED"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: "Any API call without `Authorization` gets 401 with `WWW-Authenticate: Bearer`."
